<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Inter', Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#0A0B0F"/>

  <!-- ===================== Logo principal ===================== -->
  <text x="40" y="45" font-size="15" font-weight="600" fill="#EDEFF4">Maré — logo</text>
  <text x="40" y="66" font-size="12" fill="#8E93A3">Onda suave — sentimento como fluxo, não como rótulo fixo</text>

  <g transform="translate(120,170)">
    <rect x="-56" y="-56" width="112" height="112" rx="26" fill="#1B2A33"/>
    <path d="M -30 6 Q -15 -12, 0 6 T 30 6" fill="none" stroke="#4FD1C5" stroke-width="7" stroke-linecap="round"/>
    <path d="M -30 20 Q -15 2, 0 20 T 30 20" fill="none" stroke="#4FD1C5" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>
  <text x="120" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEFF4">Duas ondas</text>
  <text x="120" y="273" text-anchor="middle" font-size="11" fill="#6B7180">o que foi escrito x o que foi sentido</text>

  <!-- versao icone de app -->
  <g transform="translate(340,170)">
    <rect x="-56" y="-56" width="112" height="112" rx="26" fill="#4FD1C5"/>
    <path d="M -30 6 Q -15 -12, 0 6 T 30 6" fill="none" stroke="#0A0B0F" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="340" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEFF4">Ícone de app</text>
  <text x="340" y="273" text-anchor="middle" font-size="11" fill="#6B7180">fundo accent cheio</text>

  <!-- wordmark -->
  <g transform="translate(600,150)">
    <rect x="-40" y="-40" width="80" height="80" rx="19" fill="#1B2A33"/>
    <path d="M -22 4 Q -11 -9, 0 4 T 22 4" fill="none" stroke="#4FD1C5" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="660" y="163" font-size="34" font-weight="600" font-family="'Space Grotesk', sans-serif" fill="#EDEFF4">maré</text>
  <text x="600" y="255" text-anchor="middle" font-size="11" fill="#6B7180">wordmark: símbolo + nome minúsculo</text>

  <!-- teste tamanho pequeno -->
  <text x="40" y="330" font-size="15" font-weight="600" fill="#EDEFF4">Teste em tamanho reduzido</text>
  <g transform="translate(80,380)">
    <rect x="0" y="0" width="64" height="64" rx="15" fill="#4FD1C5"/>
    <path d="M 14 34 Q 22 24, 32 34 T 50 34" fill="none" stroke="#0A0B0F" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(180,388)">
    <rect x="0" y="0" width="48" height="48" rx="11" fill="#4FD1C5"/>
    <path d="M 10 25 Q 16 18, 24 25 T 38 25" fill="none" stroke="#0A0B0F" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(260,394)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#4FD1C5"/>
    <path d="M 6 17 Q 11 12, 16 17 T 26 17" fill="none" stroke="#0A0B0F" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(320,398)">
    <rect x="0" y="0" width="20" height="20" rx="5" fill="#4FD1C5"/>
    <path d="M 4 10.5 Q 7 7, 10 10.5 T 16 10.5" fill="none" stroke="#0A0B0F" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- paleta -->
  <text x="40" y="470" font-size="15" font-weight="600" fill="#EDEFF4">Paleta (dark mode, mesmo padrão do Vira)</text>
  <g transform="translate(60,500)">
    <rect width="140" height="60" rx="10" fill="#14161C" stroke="#2A2E3A"/>
    <text x="10" y="35" font-size="11" fill="#8E93A3">fundo</text>
    <text x="10" y="50" font-size="10" fill="#6B7180">#14161C</text>
  </g>
  <g transform="translate(215,500)">
    <rect width="140" height="60" rx="10" fill="#1C1F28" stroke="#2A2E3A"/>
    <text x="10" y="35" font-size="11" fill="#8E93A3">superfície</text>
    <text x="10" y="50" font-size="10" fill="#6B7180">#1C1F28</text>
  </g>
  <g transform="translate(370,500)">
    <rect width="140" height="60" rx="10" fill="#4FD1C5"/>
    <text x="10" y="35" font-size="11" fill="#0A0B0F">accent</text>
    <text x="10" y="50" font-size="10" fill="#0A0B0F">#4FD1C5</text>
  </g>
  <g transform="translate(525,500)">
    <rect width="140" height="60" rx="10" fill="#E8B84B"/>
    <text x="10" y="35" font-size="11" fill="#0A0B0F">alerta suave</text>
    <text x="10" y="50" font-size="10" fill="#0A0B0F">#E8B84B</text>
  </g>
  <g transform="translate(680,500)">
    <rect width="140" height="60" rx="10" fill="#B48CE8"/>
    <text x="10" y="35" font-size="11" fill="#0A0B0F">reflexão</text>
    <text x="10" y="50" font-size="10" fill="#0A0B0F">#B48CE8</text>
  </g>

  <text x="40" y="600" font-size="12" fill="#6B7385">Accent verde-água (não vermelho/vibrante) propositalmente — tom calmo, não gera urgência num diário íntimo.</text>
</svg>
